
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #60a5fa;
        }

        #chatbox {
            height: 430px;
            overflow-y: auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
        }

        .message {
            padding: 12px;
            margin: 12px 0;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #2563eb;
            margin-left: 60px;
        }

        .bot {
            background: #334155;
            margin-right: 60px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.8;
        }

        .mic {
            background: #16a34a;
            font-size: 20px;
        }

        .stop {
            background: #dc2626;
        }

        #status {
            text-align: center;
            color: #94a3b8;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Voice Assistant</h1>

    <div id="chatbox">
        <div class="message bot">
            Hello! I am your AI assistant.
            You can type or speak to me.
        </div>
    </div>

    <p id="status">Ready to chat</p>

    <div class="controls">

        <input
            type="text"
            id="message"
            placeholder="Ask me anything..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">Send</button>

        <button class="mic" onclick="startListening()">
            🎤
        </button>

        <button class="stop" onclick="stopSpeaking()">
            🔇
        </button>

    </div>

</div>

<script>

const chatbox = document.getElementById("chatbox");
const input = document.getElementById("message");
const statusText = document.getElementById("status");

let history = [];

function addMessage(text, sender) {

    const div = document.createElement("div");

    div.className = "message " + sender;
    div.textContent = text;

    chatbox.appendChild(div);

    chatbox.scrollTop = chatbox.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    statusText.textContent = "AI is thinking...";

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                history: history
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.reply || "Request failed");
        }

        const reply = data.reply;

        addMessage(reply, "bot");

        history.push(
            { role: "user", content: message },
            { role: "assistant", content: reply }
        );

        speak(reply);

        statusText.textContent = "Ready to chat";

    } catch (error) {

        addMessage(error.message, "bot");

        statusText.textContent = "Something went wrong";

    }
}


// Text to Speech
function speak(text) {

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

}


// Speech to Text
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        statusText.textContent = "Listening...";
    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        input.value = transcript;

        sendMessage();

    };

    recognition.onerror = function(event) {
        statusText.textContent =
            "Voice error: " + event.error;
    };

    recognition.onend = function() {
        if (statusText.textContent === "Listening...") {
            statusText.textContent = "Ready to chat";
        }
    };

}

function startListening() {

    if (!recognition) {
        statusText.textContent =
            "Speech recognition is not supported in this browser.";
        return;
    }

    window.speechSynthesis.cancel();

    recognition.start();

}

function stopSpeaking() {

    window.speechSynthesis.cancel();

    if (recognition) {
        recognition.abort();
    }

    statusText.textContent = "Voice stopped";

}

</script>

</body>
</html>
